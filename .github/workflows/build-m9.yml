name: Build Batocera M9

on:
  workflow_dispatch:
  push:
    branches:
      - rk3326-m9-port
    paths-ignore:
      - '.circleci/**'

jobs:
  build-m9:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    env:
      DIRECT_BUILD: "1"
      PARALLEL_BUILD: "1"
      BATCH_MODE: "1"
      MAKE_JLEVEL: "2"
      MAKE_LLEVEL: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Mostrar ambiente
        run: |
          echo "CPUs: $(nproc)"
          free -h
          df -h
          gcc --version | head -1
          g++ --version | head -1
          ldd --version | head -1
          git log -1 --oneline

      - name: Restaurar downloads
        id: restore-dl
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: m9-dl-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            m9-dl-${{ runner.os }}-

      - name: Restaurar ccache
        id: restore-ccache
        uses: actions/cache/restore@v4
        with:
          path: buildroot-ccache
          key: m9-ccache-${{ runner.os }}-ubuntu22-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            m9-ccache-${{ runner.os }}-ubuntu22-${{ github.ref_name }}-
            m9-ccache-${{ runner.os }}-ubuntu22-

      - name: Corrigir host-xxhash
        run: |
          python3 scripts/fix-host-xxhash.py
          python3 scripts/fix-host-lua.py
          python3 scripts/fix-host-libtool.py
          python3 scripts/fix-host-zic.py
          grep -A12 "define HOST_XXHASH_BUILD_CMDS" buildroot/package/xxhash/xxhash.mk

      - name: Compilar Batocera M9
        id: build
        shell: bash
        run: |
          mkdir -p m9-diagnostics
          touch m9-diagnostics/m9-build.log

          set +e

          make rk3326-m9-build \
            DIRECT_BUILD=1 \
            PARALLEL_BUILD=1 \
            BATCH_MODE=1 \
            MAKE_JLEVEL=2 \
            MAKE_LLEVEL=2 \
            2>&1 | tee -a m9-diagnostics/m9-build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo "Build exit code: $BUILD_STATUS" | tee -a m9-diagnostics/m9-build.log
          echo "build_status=$BUILD_STATUS" >> "$GITHUB_OUTPUT"

          exit 0

      - name: Criar diagnostico
        if: always()
        shell: bash
        run: |
          mkdir -p m9-diagnostics
          LOG="m9-diagnostics/m9-build.log"

          {
            echo "======================================"
            echo " M9 BUILD DIAGNOSTICS"
            echo "======================================"
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Build status: ${{ steps.build.outputs.build_status }}"
            echo
            echo "===== DISK ====="
            df -h
            echo
            echo "===== MEMORY ====="
            free -h
            echo
            echo "===== IMPORTANT ERRORS ====="

            if [ -f "$LOG" ]; then
              grep -Ein \
                "error:|fatal:|fatal error|undefined reference|No rule to make target|No such file|cannot find|failed|collect2:|make.*\*\*\*" \
                "$LOG" | tail -n 500 || true
            else
              echo "m9-build.log NAO EXISTE"
            fi

            echo
            echo "===== LAST 1000 LINES ====="

            if [ -f "$LOG" ]; then
              tail -n 1000 "$LOG"
            else
              echo "SEM LOG DE BUILD"
            fi

          } > m9-diagnostics/failure-summary.txt

          echo "===== DIAGNOSTIC FILES ====="
          ls -lah m9-diagnostics/
          echo
          cat m9-diagnostics/failure-summary.txt

      - name: Upload diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m9-build-diagnostics-${{ github.run_id }}
          path: |
            m9-diagnostics/m9-build.log
            m9-diagnostics/failure-summary.txt
          if-no-files-found: error
          retention-days: 7

      - name: Salvar downloads
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dl
          key: m9-dl-${{ runner.os }}-${{ github.run_id }}

      - name: Salvar ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: buildroot-ccache
          key: m9-ccache-${{ runner.os }}-ubuntu22-${{ github.ref_name }}-${{ github.run_id }}

      - name: Localizar imagem
        if: always()
        run: |
          find output/rk3326-m9/images -maxdepth 2 -type f -ls 2>/dev/null || true

      - name: Preparar artefatos
        if: success()
        run: |
          mkdir -p m9-artifacts
          find output/rk3326-m9/images -maxdepth 2 -type f \
            \( -name '*.img' -o -name '*.img.gz' -o -name '*.img.xz' -o -name '*.tar.gz' \) \
            -exec cp -v {} m9-artifacts/ \; 2>/dev/null || true
          ls -lh m9-artifacts

      - name: Upload da imagem
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: batocera-rk3326-m9
          path: m9-artifacts/
          if-no-files-found: error
          retention-days: 7
