name: Build Batocera M9

on:
  workflow_dispatch:
  push:
    branches:
      - rk3326-m9-port
    paths-ignore:
      - '.circleci/**'

jobs:
  build-m9:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    env:
      DIRECT_BUILD: "1"
      PARALLEL_BUILD: "1"
      BATCH_MODE: "1"
      MAKE_JLEVEL: "2"
      MAKE_LLEVEL: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Mostrar ambiente
        run: |
          echo "CPUs: $(nproc)"
          free -h
          df -h
          gcc --version | head -1
          g++ --version | head -1
          ldd --version | head -1
          git log -1 --oneline

      - name: Restaurar downloads
        id: restore-dl
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: m9-dl-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            m9-dl-${{ runner.os }}-

      - name: Restaurar ccache
        id: restore-ccache
        uses: actions/cache/restore@v4
        with:
          path: buildroot-ccache
          key: m9-ccache-${{ runner.os }}-ubuntu22-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            m9-ccache-${{ runner.os }}-ubuntu22-${{ github.ref_name }}-
            m9-ccache-${{ runner.os }}-ubuntu22-

      - name: Corrigir host-xxhash
        run: |
          python3 scripts/fix-host-xxhash.py
          python3 scripts/fix-host-lua.py
          python3 scripts/fix-host-libtool.py
          python3 scripts/fix-host-zic.py
          grep -A12 "define HOST_XXHASH_BUILD_CMDS" buildroot/package/xxhash/xxhash.mk

      - name: Compilar Batocera M9
        shell: bash
        run: |
          set -o pipefail
          make rk3326-m9-build \
            DIRECT_BUILD=1 \
            PARALLEL_BUILD=1 \
            BATCH_MODE=1 \
            MAKE_JLEVEL=2 \
            MAKE_LLEVEL=2 2>&1 | tee m9-build.log

      - name: Resumo automatico da falha
        if: failure()
        shell: bash
        run: |
          mkdir -p m9-diagnostics
          {
            echo "=== M9 BUILD FAILURE SUMMARY ==="
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_RUN_ID"
            echo
            echo "=== ERROS IMPORTANTES ==="
            grep -Ei "No rule to make target|No such file or directory|cannot find|undefined reference|fatal error:|collect2: error|make(\[[0-9]+\])?: \*\*\*" m9-build.log | tail -n 250 || true
            echo
            echo "=== ULTIMAS 300 LINHAS ==="
            tail -n 300 m9-build.log || true
          } > m9-diagnostics/failure-summary.txt

          cp m9-build.log m9-diagnostics/ || true
          cat m9-diagnostics/failure-summary.txt

      - name: Upload diagnostico
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m9-build-failure-${{ github.run_id }}
          path: m9-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Salvar downloads
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dl
          key: m9-dl-${{ runner.os }}-${{ github.run_id }}

      - name: Salvar ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: buildroot-ccache
          key: m9-ccache-${{ runner.os }}-ubuntu22-${{ github.ref_name }}-${{ github.run_id }}

      - name: Localizar imagem
        if: always()
        run: |
          find output/rk3326-m9/images -maxdepth 2 -type f -ls 2>/dev/null || true

      - name: Preparar artefatos
        if: success()
        run: |
          mkdir -p m9-artifacts
          find output/rk3326-m9/images -maxdepth 2 -type f \
            \( -name '*.img' -o -name '*.img.gz' -o -name '*.img.xz' -o -name '*.tar.gz' \) \
            -exec cp -v {} m9-artifacts/ \; 2>/dev/null || true
          ls -lh m9-artifacts

      - name: Upload da imagem
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: batocera-rk3326-m9
          path: m9-artifacts/
          if-no-files-found: error
          retention-days: 7
