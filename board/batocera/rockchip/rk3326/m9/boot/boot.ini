odroidgoa-uboot-config

setenv hwrev m9

setenv bootargs "label=BATOCERA console=ttyS2,115200 console=tty3 quiet loglevel=0 consoleblank=0 vt.global_cursor_default=0"

setenv loadaddr "0x02000000"
setenv dtb_loadaddr "0x01f00000"
setenv dtbo_loadaddr "0x01e00000"
setenv initrd_loadaddr "0x04000000"

load mmc 1:1 ${loadaddr} linux
load mmc 1:1 ${initrd_loadaddr} uInitrd

if test ${hwrev} = 'm9'; then
  load mmc 1:1 ${dtb_loadaddr} rk3326-m9-linux.dtb
fi

booti ${loadaddr} ${initrd_loadaddr} ${dtb_loadaddr}